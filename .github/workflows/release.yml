name: Release

# Push a tag that matches manifest.json "version" (e.g. 1.0.0, no "v" prefix)
# and this workflow creates a draft GitHub release with the plugin files attached.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($VERSION)"
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['$VERSION']) { console.error('versions.json is missing $VERSION'); process.exit(1); }"

      - name: Syntax check
        run: node --check main.js

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
