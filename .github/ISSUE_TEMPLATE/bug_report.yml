name: Bug report
description: Something in Foyer is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should Foyer have done instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open a new tab
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: foyer-version
    attributes:
      label: Foyer version
      description: Found in Settings → Community plugins → Foyer, or in the plugin's manifest.json.
      placeholder: "1.1.1"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Found in Settings → About.
      placeholder: "1.8.10"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
    validations:
      required: true

  - type: textarea
    id: console-errors
    attributes:
      label: Console errors
      description: Optional. Open the developer console (Ctrl/Cmd + Shift + I), reproduce the bug, and paste any red error messages from the Console tab.
      render: text
    validations:
      required: false
