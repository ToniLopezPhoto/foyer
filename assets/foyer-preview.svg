<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Foyer interface illustration in dark and light themes</title>
<desc id="desc">Illustrative preview of the Foyer Obsidian plugin featuring a personalized greeting, instant search and recently opened notes in two color themes. Not a screenshot.</desc>
